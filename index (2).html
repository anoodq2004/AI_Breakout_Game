<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A multiplayer escape room that teaches AI prompting basics.">
<title>Prompt Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@600;800&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: a station console. Sticky status bar on top, the room's briefing + puzzle in the main column, a live station map and crew ranks in a side column that stacks below on phones. Single dark theme by choice (a ship interior). */
:root{
  --bg:#0D1220; --panel:#151C2E; --panel-2:#1C2439; --line:#2A3450;
  --fg:#E9EDF6; --muted:#93A0BD; --accent:#FFB547; --accent-ink:#1C1405;
  --ok:#5CD68F; --bad:#FF7F7F; --focus:#FFD28A;
  --l-open:#3FB950; --l-conf:#2F7FE0; --l-sens:#E97132; --l-secret:#E5484D;
  --f-display:"Oxanium","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:700;text-decoration:none}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:24px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--accent)}
.lede{font-size:18px;max-width:58ch;color:var(--fg)}
.note{font-size:14px;color:var(--muted);max-width:60ch}
.note.warn{color:var(--accent)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px;border-top:1px solid var(--line);padding-top:24px}
.how h3{font-size:16px;margin-bottom:6px}
.how .n{font-family:var(--f-mono);color:var(--accent);font-size:13px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:20px}
.formgrid{display:grid;gap:18px;max-width:460px}
label.lbl{display:block;font-weight:700;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
input[type=text]{width:100%;min-height:46px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
input.code{font-family:var(--f-mono);font-size:26px;letter-spacing:.35em;text-transform:uppercase}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:8px;border:2px solid transparent;background:var(--panel-2);cursor:pointer;font-size:11px;color:var(--muted)}
.sw[aria-checked=true]{border-color:var(--accent);color:var(--fg)}
.err{color:var(--bad);font-weight:700;min-height:1.4em}

/* code display */
.codebig{display:flex;gap:8px;flex-wrap:wrap}
.codebig span{font-family:var(--f-mono);font-weight:700;font-size:clamp(36px,8vw,64px);width:1.4em;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding-block:4px;color:var(--accent)}

/* crew */
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mate{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:8px;padding:8px 10px;min-width:0}
.mate b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.you{font-family:var(--f-mono);font-size:10px;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 5px;flex:none}
.empty{border:1px dashed var(--line);border-radius:8px;padding:16px;color:var(--muted);font-size:14px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.chip{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}
.chip b{color:var(--fg)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.pen{font-family:var(--f-mono);font-size:13px;color:var(--bad)}
.letters{display:flex;gap:4px}
.letters span{width:26px;height:30px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.letters span.got{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spacer{flex:1}

/* game layout */
.game{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.game > *{min-width:0}
.roomhead{display:flex;flex-direction:column;gap:4px}
.roomhead h2{font-size:clamp(24px,4vw,34px)}
details.brief{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.brief summary{cursor:pointer;padding:14px 20px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.brief summary::-webkit-details-marker{display:none}
details.brief summary::after{content:"Hide";font-weight:400;color:var(--muted);font-size:14px}
details.brief:not([open]) summary::after{content:"Show"}
.brief .body{padding:0 20px 18px;display:flex;flex-direction:column;gap:12px;max-width:68ch}
dl.parts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0}
dl.parts dt{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:2px}
dl.parts dd{margin:0}
.swap{width:100%;border-collapse:collapse;font-size:15px}
.swap td{padding:6px 8px;border-bottom:1px solid var(--line)}
.swap td:first-child{color:var(--bad);font-family:var(--f-mono);white-space:nowrap}
.swap td:last-child{color:var(--ok)}
.tablewrap{overflow-x:auto}
pre.ex{margin:0;white-space:pre-wrap;font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px}

.challenge{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.challenge .q{font-size:18px;font-weight:700}
blockquote{margin:0;padding:12px 14px;border-inline-start:3px solid var(--accent);background:var(--bg);border-radius:8px;font-style:italic}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;min-height:48px;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.opt .k{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted);flex:none;margin-top:2px}
.opt[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel-2))}
.opt[aria-pressed=true] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.words{display:flex;flex-wrap:wrap;gap:8px;font-size:20px}
.word{padding:6px 10px;border-radius:6px;border:1px dashed var(--line);background:var(--bg);cursor:pointer}
.word[aria-pressed=true]{border-style:solid;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg));text-decoration:line-through;text-decoration-color:var(--bad)}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center;background:var(--panel-2);border-radius:8px;padding:10px 12px}
.mrow select{min-height:42px;border-radius:6px;border:1px solid var(--line);background:var(--bg);padding:6px 8px;width:100%}
.tiles{display:flex;gap:10px;flex-wrap:wrap}
.tile{width:56px;height:64px;font-family:var(--f-mono);font-weight:700;font-size:28px;border-radius:8px;border:1px solid var(--accent);background:var(--panel-2);color:var(--accent);cursor:pointer}
.tile:disabled{opacity:.25;cursor:default}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:56px;height:64px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:28px;border-radius:8px;border:2px dashed var(--line)}
.slot.f{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid var(--bad)}
.fb b{font-family:var(--f-display)}

/* map */
.side{display:flex;flex-direction:column;gap:16px}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;position:relative}
.cell{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:6px}
.cell.here{border-color:var(--accent)}
.cell.exit{grid-column:1 / -1;min-height:60px;background:color-mix(in srgb,var(--ok) 10%,var(--panel-2))}
.cell .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cell .bots{display:flex;flex-wrap:wrap;gap:2px}
.side h3{font-size:14px;font-family:var(--f-mono);font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

/* board */
.board{width:100%;border-collapse:collapse;font-size:15px}
.board td,.board th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.board th{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.board .rk{font-family:var(--f-mono);color:var(--muted);width:2.2em}
.board .tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.board .nm{display:flex;align-items:center;gap:8px;min-width:0}
.board .nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:14ch}
.board tr.me td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.status{font-size:13px;color:var(--muted)}
.status.won{color:var(--ok);font-weight:700}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end}
.pod{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod.p1{border-color:var(--accent);padding-block:26px}
.pod .place{font-family:var(--f-display);font-size:28px;color:var(--accent)}
.pod b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}

.big{font-family:var(--f-display);font-size:clamp(34px,7vw,60px);font-weight:800;font-variant-numeric:tabular-nums}
.countdown{min-height:60vh;display:grid;place-items:center;text-align:center}
.countdown .num{font-family:var(--f-display);font-size:clamp(90px,22vw,180px);font-weight:800;color:var(--accent);line-height:1}
.banner{background:color-mix(in srgb,var(--accent) 14%,var(--panel));border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:14px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--bad);border-radius:8px;padding:10px 12px}

/* breakout-room effects */
.roomwrap{position:relative;overflow:clip;border-radius:var(--r)}
.story{font-size:15px;color:var(--muted);max-width:68ch;font-style:italic}
.devhead{display:flex;align-items:center;gap:14px}
.devhead .led{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;padding:3px 8px;border-radius:4px;border:1px solid var(--bad);color:var(--bad)}
.devhead .led.on{border-color:var(--ok);color:var(--ok)}
.lock{flex:none;overflow:visible}
.lock .shackle{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;transform-box:view-box;transform-origin:34px 26px}
.lock .lbody{fill:var(--bad);transition:fill .3s}
.lock .hole{fill:var(--bg)}
.lock.open .lbody{fill:var(--ok)}
.lock.open .shackle{transform:translateY(-8px) rotate(-28deg);stroke:var(--ok)}
.lock.anim .shackle{animation:shackle .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes shackle{0%{transform:none}35%{transform:translateY(-10px)}100%{transform:translateY(-8px) rotate(-28deg)}}
.doors{position:absolute;inset:0;z-index:4;display:flex;pointer-events:none}
.doors i{flex:1;background:repeating-linear-gradient(135deg,var(--panel-2) 0 22px,var(--panel) 22px 44px);border:1px solid var(--line)}
.doors i.dl{border-inline-end:3px solid var(--accent);animation:doorL .9s .35s cubic-bezier(.6,0,.3,1) forwards}
.doors i.dr{border-inline-start:3px solid var(--accent);animation:doorR .9s .35s cubic-bezier(.6,0,.3,1) forwards}
.doors b{position:absolute;left:50%;top:80px;transform:translateX(-50%);font-family:var(--f-display);font-size:clamp(22px,4vw,34px);letter-spacing:.2em;text-transform:uppercase;background:var(--bg);color:var(--accent);padding:6px 16px;border-radius:6px;animation:fadeout .3s .3s forwards;white-space:nowrap}
@keyframes doorL{to{transform:translateX(-101%)}}
@keyframes doorR{to{transform:translateX(101%)}}
@keyframes fadeout{to{opacity:0}}
.challenge.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.challenge.alarm{box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 45%,transparent)}
.challenge.solved{border-color:var(--ok)}
.reveal{display:flex;align-items:center;gap:14px}
.reveal .card{width:54px;height:64px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);animation:flip .6s ease-out}
.reveal .card.badge{background:var(--ok);font-size:14px;width:auto;padding:0 12px}
@keyframes flip{from{transform:rotateY(90deg) scale(.6)}to{transform:none}}
.shield{flex:none}
.labels{display:grid;gap:10px}
.labelrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.labelrow .nm{font-weight:700}
.labelrow .scope{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.mrow label{display:flex;align-items:center;gap:10px}
.badge-slot{font-family:var(--f-mono);font-size:11px;height:30px;display:grid;place-items:center;padding:0 8px;border:1px solid var(--line);border-radius:5px;color:var(--muted)}
.badge-slot.got{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.cell.wide{grid-column:1 / -1}
.cell .lk{font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.cell.clear .t{color:var(--ok)}
.snd{min-height:36px;padding:6px 12px;font-size:13px}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.doors{display:none}.challenge.shake{animation:none}.lock.anim .shackle{animation:none}}

/* language toggle + Arabic / right-to-left */
.langbtn[lang="ar"]{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:700}
.langbtn[lang="en"]{font-family:"Atkinson Hyperlegible",system-ui,sans-serif}

.briefpage{display:flex;flex-direction:column;gap:14px}
.briefpage .body{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.briefgo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.big-go{min-height:52px;padding:12px 24px;font-size:17px}
.joinrow{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.qr{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox{width:168px;height:168px;max-width:100%;border-radius:10px;overflow:hidden;background:#FFFFFF}
.chip.paused{border-color:var(--accent);color:var(--accent)}
#langfab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;z-index:20}
#langfab .btn{background:var(--panel);border-color:var(--muted);min-height:38px;padding:6px 14px}
.bar .in{padding-right:130px}
#bar:empty ~ #app{padding-top:64px}
.timer,.big,.codebig,input.code{direction:ltr;unicode-bidi:isolate}
:root[lang="ar"]{--f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[lang="ar"] body{line-height:1.75}
:root[lang="ar"] .eyebrow,:root[lang="ar"] .chip,:root[lang="ar"] .cell .t,:root[lang="ar"] .side h3,:root[lang="ar"] .board th,
:root[lang="ar"] dl.parts dt,:root[lang="ar"] .devhead .led,:root[lang="ar"] .labelrow .scope,:root[lang="ar"] .badge-slot,
:root[lang="ar"] .you,:root[lang="ar"] .swap td:first-child,:root[lang="ar"] pre.ex,:root[lang="ar"] .doors b,:root[lang="ar"] .pen{font-family:var(--f-body);letter-spacing:0;text-transform:none}
:root[lang="ar"] .eyebrow{font-size:13px;font-weight:700}
:root[lang="ar"] .tile,:root[lang="ar"] .slot,:root[lang="ar"] .letters span,:root[lang="ar"] .reveal .card{font-family:var(--f-display)}
:root[lang="ar"] .reveal .card.badge{font-family:var(--f-body);font-size:13px;white-space:nowrap}
:root[lang="ar"] .hero h1{letter-spacing:0;line-height:1.3}
:root[lang="ar"] blockquote{font-style:normal}
:root[lang="ar"] details.brief summary::after{content:"إخفاء"}
:root[lang="ar"] details.brief:not([open]) summary::after{content:"إظهار"}
[dir="rtl"] .doors i.dl{animation-name:doorR}
[dir="rtl"] .doors i.dr{animation-name:doorL}

@media (max-width:860px){
  .game{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .how{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .mrow{grid-template-columns:minmax(0,1fr)}
  .podium{grid-template-columns:minmax(0,1fr)}
  .tile,.slot{width:48px;height:56px;font-size:24px}
  .timer{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .countdown .num{animation:pop .9s ease-out}
  @keyframes pop{from{transform:scale(1.4);opacity:.3}to{transform:scale(1);opacity:1}}
  .fb{animation:rise .25s ease-out}
  @keyframes rise{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
}
</style>
<script src="/vendor/xlsx.full.min.js" defer></script>
<script src="/vendor/qrcode.js" defer></script>
</head>
<body>
<div id="langfab"></div>
<div id="bar"></div>
<div id="offline" class="wrap" hidden style="padding-block:8px 0"><div class="banner" role="status">Connection lost. Reconnecting… Your progress on this screen is kept.</div></div>
<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";

function tone(f,dur,type,vol,delay,to){var a=ac();if(!a)return;var tt=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,tt);if(to)o.frequency.exponentialRampToValueAtTime(to,tt+dur);
  g.gain.setValueAtTime(0.0001,tt);g.gain.exponentialRampToValueAtTime(vol||0.15,tt+0.01);g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);
  o.connect(g);g.connect(a.destination);o.start(tt);o.stop(tt+dur+0.02);}
function noise(dur,vol,delay,f1,f2){var a=ac();if(!a)return;var tt=a.currentTime+(delay||0),n=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;var s=a.createBufferSource();s.buffer=buf;var fl=a.createBiquadFilter();fl.type='lowpass';
  fl.frequency.setValueAtTime(f1||800,tt);fl.frequency.exponentialRampToValueAtTime(f2||200,tt+dur);var g=a.createGain();
  g.gain.setValueAtTime(vol||0.2,tt);g.gain.exponentialRampToValueAtTime(0.0001,tt+dur);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(tt);}

/* ---------- confetti ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);
  var ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,P=[];
  for(var i=0;i<240;i++){var left=i%2===0;P.push({x:left?0:W,y:H*0.9,vx:(left?1:-1)*(4+Math.random()*9)*dpr,vy:-(10+Math.random()*12)*dpr,
    r:Math.random()*6,vr:(Math.random()-.5)*0.4,w:(6+Math.random()*6)*dpr,h:(3+Math.random()*4)*dpr,c:COLORS[i%COLORS.length]});}
  var f=0;(function loop(){ctx.clearRect(0,0,W,H);P.forEach(function(p){p.vy+=0.35*dpr;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(++f<240)requestAnimationFrame(loop);else c.remove();})();}

function fmt(ms){if(ms==null||!isFinite(ms))return '--:--';ms=Math.max(0,ms);var x=Math.floor(ms/100),d=x%10,s=Math.floor(x/10)%60,m=Math.floor(x/600);return m+':'+(s<10?'0':'')+s+'.'+d}

function qrSvg(text){
  if(typeof window.qrcode!=='function')return '';
  try{var q=qrcode(0,'M');q.addData(text);q.make();
    var n=q.getModuleCount(),m=4,sz=n+m*2,d='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
    return '<svg viewBox="0 0 '+sz+' '+sz+'" width="100%" height="100%" shape-rendering="crispEdges" role="img" aria-label="'+t('qr_aria')+'"><rect width="'+sz+'" height="'+sz+'" style="fill:#FFFFFF"/><path d="'+d+'" style="fill:#0D1220"/></svg>';
  }catch(e){return ''}}

    r[t('x_left')]=p.left&&!p.done?t('x_yes'):t('x_no');return r});
  if(!rows.length){if(msg)msg.textContent=t('x_none');return}
  var d=new Date(S.startedAt||Date.now());function pad(n){return (n<10?'0':'')+n}

    [t('x_state'),S.hostPhase==='ended'?t('x_final'):t('x_progress')]];

    if(LANG==='ar')wb.Workbook={Views:[{RTL:true}]};
    XLSX.writeFile(wb,base+'.xlsx');if(msg)msg.textContent=t('x_saved',{f:base+'.xlsx'});
  } else {
    var keys=Object.keys(rows[0]);var q=function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
    var csv='﻿'+keys.map(q).join(',')+'\n'+rows.map(function(r){return keys.map(function(k){return q(r[k])}).join(',')}).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=base+'.csv';document.body.appendChild(a);a.click();a.remove();

function genCode(){var a='ABCDEFGHJKMNPQRSTUVWXYZ',s='';for(var i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function sanitize(p){var pr=p.presence||{};
  return {peer:p.peer,me:!!p.sameTab,role:pr.role,name:(typeof pr.name==='string'&&pr.name.trim()?pr.name:t('crewmate')).slice(0,14),
    color:(pr.color>=0&&pr.color<8)?Math.floor(pr.color):0,stage:Math.max(0,Math.min(N,Math.floor(Number(pr.stage)||0))),
    pid:typeof pr.pid==='string'?pr.pid.slice(0,16):'',
    done:pr.done===true&&typeof pr.ms==='number',ms:typeof pr.ms==='number'?pr.ms:null,pen:Math.max(0,Math.floor(Number(pr.pen)||0))};}
function getHost(){var hs=peers.filter(function(p){return p.presence&&p.presence.role==='host'&&!p.sameTab});
  hs.sort(function(a,b){return (Number(a.presence.since)||0)-(Number(b.presence.since)||0)});return hs[0]||null}
function crew(){
  if(S.mode==='solo')return [{peer:'me',me:true,name:S.name||t('you_name'),color:S.color,stage:S.stage,done:S.finishMs!=null,ms:S.finishMs,pen:S.penalty}];
  if(S.mode==='host'&&S.hostPhase!=='lobby')return Object.keys(S.record).map(function(k){return S.record[k]});
  var list=peers.filter(function(p){return p.presence&&p.presence.role==='player'}).map(sanitize);
  if(S.mode==='player'&&!list.some(function(x){return x.me}))list.push({peer:'me',me:true,name:S.name,color:S.color,stage:S.stage,done:S.finishMs!=null,ms:S.finishMs,pen:S.penalty});
  return list;}
function ranked(){return crew().slice().sort(function(a,b){
  if(a.done&&b.done)return a.ms-b.ms; if(a.done)return -1; if(b.done)return 1;
  if(b.stage!==a.stage)return b.stage-a.stage; return a.pen-b.pen;});}
function myPresence(){return {role:'player',pid:PID,name:S.name,color:S.color,stage:S.stage,done:S.finishMs!=null,ms:S.finishMs,pen:S.penalty}}
function pushPresence(){if(R&&S.mode==='player')R.presence(myPresence()).catch(function(){})}

async function joinRoom(code){
  var r=await roomApi.join('ps-'+code.toLowerCase());
  R=r;peers=r.peers();
  unsubPeers=r.onPeers(function(ch){peers=ch.peers;onPeersChanged()},function(e){
    R=null;peers=[];S.connErr=['err_conn',{c:S.code,e:e.code}];render();});
  return r;}
async function leaveRoom(){if(unsubPeers){unsubPeers();unsubPeers=null}if(R){try{await R.leave()}catch(e){}}R=null;peers=[];clearTimeout(noHostTimer)}

function recordPlayers(){
  if(S.mode!=='host'||S.hostPhase==='lobby')return;
  var here={};
  peers.forEach(function(p){if(!p.presence||p.presence.role!=='player')return;var x=sanitize(p);var key=x.pid||x.peer;here[key]=1;
    var old=S.record[key];if(S.hostPhase==='ended'&&old&&old.done)return;x.left=false;S.record[key]=x;});
  Object.keys(S.record).forEach(function(k){if(!here[k])S.record[k].left=true});}
function onPeersChanged(){
  recordPlayers();
  if(S.mode==='player'){
    var h=getHost();
    if(h){S.hostSeen=true;S.noHost=false;S.hostGone=false;clearTimeout(noHostTimer);
      var ph=h.presence.phase, prev=S.hostPhase; S.hostPhase=ph;
      if(ph==='live'&&S.screen==='lobby'){S.limitMs=Math.max(0,Number(h.presence.limitMs)||0);startCountdown();return}
      if(ph==='lobby'&&prev!=='lobby'&&S.screen!=='lobby'){resetRun();S.screen='lobby';render();return}
      if(ph==='ended'&&prev!=='ended'){S.screen='ended';render();play('win');confetti();return}
      if(S.screen==='lobby'&&prev==='lobby'){render();return}
    } else if(S.hostSeen && !S.hostGone){S.hostGone=true;render();return}
  }
  updateLive();}

/* ---------- flow ---------- */
function resetRun(){S.stage=0;S.startLocal=null;S.activeMs=0;S.runSince=null;S.phase='brief';S.penalty=0;S.finishMs=null;S.letters=[];S.badge=false;clearAnswer()}
function clearAnswer(){S.sel=null;S.tap=[];S.match=[];S.unscr=[];S.fb=null}
function startCountdown(){resetRun();S.screen='countdown';S.cdEnd=Date.now()+3000;pushPresence();render();play('beep')}

async function hostCreate(){
  if(!roomApi)return;S.busy=true;S.joinErr='';render();
  for(var i=0;i<3;i++){
    var code=genCode();
    try{await joinRoom(code)}catch(e){S.busy=false;S.joinErr=['err_open',{e:e&&e.code||'error'}];render();return}
    await sleep(1200);
    if(getHost()){await leaveRoom();continue}
    S.mode='host';S.code=code;S.hostPhase='lobby';S.since=Date.now();
    R.presence({role:'host',phase:'lobby',since:S.since}).catch(function(){});
    S.busy=false;S.screen='host';render();return;}
  S.busy=false;S.joinErr=['err_taken'];render();}
function hostSetPhase(ph){S.endConfirm=false;
  if(ph==='live'){S.liveAt=Date.now()+3000;S.startedAt=Date.now();S.limitMs=S.limitMin*60000;S.record={};
    peers.forEach(function(p){if(p.presence&&p.presence.role==='player'){var x=sanitize(p);S.record[x.pid||x.peer]=x}});}
  if(ph==='ended')S.endedAt=Date.now();
  S.hostPhase=ph;recordPlayers();
  if(R)R.presence({role:'host',phase:ph,since:S.since,limitMs:S.limitMs}).catch(function(){});render();}

async function playerJoin(){
  var code=(S.codeInput||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){S.joinErr=['err_code'];render();focusId('in-code');return}
  if(!S.name.trim()){S.joinErr=['err_name'];render();focusId('in-name');return}
  if(!roomApi)return;
  S.busy=true;S.joinErr='';render();
  try{await joinRoom(code)}catch(e){S.busy=false;S.joinErr=['err_join',{c:code,e:e&&e.code||'error'}];render();return}
  S.name=S.name.trim().slice(0,14);saveProfile();
  S.mode='player';S.code=code;S.busy=false;S.hostSeen=false;S.hostGone=false;S.noHost=false;S.hostPhase='lobby';S.connErr='';
  resetRun();S.screen='lobby';pushPresence();
  noHostTimer=setTimeout(function(){if(!getHost()){S.noHost=true;render()}},4000);
  onPeersChanged();render();}

function solo(){if(!S.name.trim())S.name=t('you_name');S.mode='solo';startCountdown()}
async function goHome(){await leaveRoom();S.mode=null;S.code='';S.connErr='';S.endConfirm=false;resetRun();S.screen='home';render()}

/* feedback text is built at render time, so it follows the current language */
function fbText(fb){
  var st=STAGES[Math.min(S.stage,N-1)],d=fb.d||{};
  if(fb.k==='choice')return st.why[d.sel]||'';
  if(fb.k==='tap'){
    if(fb.ok)return t('tap_ok');
    var want=st.vague,picked=d.picked||[];
    var extra=picked.filter(function(i){return want.indexOf(i)<0}).map(function(i){return qt(String(st.words[i]).replace(/[.,،]/g,''))});
    var missed=want.filter(function(i){return picked.indexOf(i)<0}).length,parts=[];
    if(extra.length)parts.push(t(extra.length>1?'tap_extra_pl':'tap_extra_1',{w:extra.join(t('and'))}));
    if(missed)parts.push(missed>1?t('tap_missed_pl',{n:missed}):t('tap_missed_1'));
    return parts.join(' ')||t('tap_check');}
  if(fb.k==='match'){
    if(fb.ok)return st.okText||t('match_ok');
    return t('match_wrong',{r:st.items.length-d.wrong.length,n:st.items.length,w:d.wrong.map(function(i){return qt(st.items[i][0])}).join(' ')});}
  if(fb.k==='unscr'){
    if(fb.ok)return t('pw_ok');
    return t('pw_bad',{w:qt((d.u||[]).map(function(i){return st.tiles[i]}).join(''))});}
  return '';}

function submit(){
  var st=STAGES[S.stage];if(!st||S.screen!=='game')return;
  if(S.phase==='brief'){startPuzzle();return}
  if(S.fb&&S.fb.final)return;
  if(S.fb&&S.fb.ok){advance();return}
  if(!canSubmit())return;
  var ok=false,fb;
  if(st.type==='choice'){ok=S.sel===st.answer;fb={k:'choice',d:{sel:S.sel}}}
  else if(st.type==='tap'){
    var picked=S.tap.slice().sort(function(a,b){return a-b}),want=st.vague;
    ok=picked.length===want.length&&picked.every(function(v,i){return v===want[i]});fb={k:'tap',d:{picked:picked}}}
  else if(st.type==='match'){var wrong=[];st.items.forEach(function(it,i){if(S.match[i]!==it[1])wrong.push(i)});ok=!wrong.length;fb={k:'match',d:{wrong:wrong}}}
  else if(st.type==='unscramble'){ok=S.unscr.map(function(i){return st.tiles[i]}).join('')===st.answer;fb={k:'unscr',d:{u:S.unscr.slice()}}}
  fb.ok=ok;
  if(ok){
    if(st.letter)S.letters.push(S.stage);
    if(st.badge)S.badge=true;
    S.anim=true;play('unlock');
    pauseClock();
    if(S.stage===N-1){S.finishMs=S.activeMs+S.penalty*1000;fb.final=true;S.fb=fb;
      if(S.mode==='solo'&&(S.best==null||S.finishMs<S.best)){S.best=S.finishMs;S.newBest=true;saveProfile()}else S.newBest=false;
      pushPresenceDone();render();
      setTimeout(function(){S.stage=N;S.screen='done';pushPresence();render();play('win');confetti();window.scrollTo({top:0})},1600);return;}
    fb.letter=!!st.letter;fb.badge=!!st.badge;S.fb=fb;
  } else {S.penalty+=PEN;S.fb=fb;S.shake=true;play('bad');pushPresence();}
  render();S.anim=false;S.shake=false;
  var f=document.getElementById('fb');if(f)f.focus();}
function pushPresenceDone(){if(R&&S.mode==='player'){var p=myPresence();p.stage=N;p.done=true;p.ms=S.finishMs;R.presence(p).catch(function(){})}}
function clearDoors(){setTimeout(function(){var d=document.querySelector('.doors');if(d)d.remove()},1400)}
function advance(){S.stage++;clearAnswer();pauseClock();S.phase='brief';S.enter=true;play('door');pushPresence();render();S.enter=false;clearDoors();window.scrollTo({top:0});}
function canSubmit(){var st=STAGES[S.stage];if(!st)return false;
  if(st.type==='choice')return S.sel!=null;
  if(st.type==='tap')return S.tap.length>0;
  if(st.type==='match')return st.items.every(function(_,i){return S.match[i]!=null});
  if(st.type==='unscramble')return S.unscr.length===st.tiles.length;return false;}

/* ---------- views ---------- */
function mapView(){
  var list=crew();var here=S.mode==='host'?-1:Math.min(S.stage,N);
  var cells=STAGES.map(function(st,i){
    var b=list.filter(function(p){return !p.done&&p.stage===i});
    var cls=(i===here&&S.screen==='game'?' here':'')+(i===N-1?' wide':'')+(S.mode!=='host'&&i<S.stage?' clear':'');
    var lk=S.mode==='host'?'':((i<S.stage||(i===S.stage&&S.fb&&S.fb.ok))?t('open_s'):(i>S.stage?t('locked_s'):''));
    return '<div class="cell'+cls+'"><span class="t">'+(i+1)+' · '+esc(st.room)+lk+'</span><div class="bots">'+b.map(function(p){return '<span title="'+esc(p.name)+'">'+bot(p.color,22)+'</span>'}).join('')+'</div></div>';}).join('');
  var out=list.filter(function(p){return p.done});
  cells+='<div class="cell exit"><span class="t">'+t('escaped_cell')+'</span><div class="bots">'+out.map(function(p){return '<span title="'+esc(p.name)+'">'+bot(p.color,22)+'</span>'}).join('')+'</div></div>';
  return cells;}
function boardRows(){
  var list=ranked();if(!list.length)return '<tr><td colspan="4" class="muted">'+t('no_crew')+'</td></tr>';

  if(st.type==='tap')h+='<div class="words" role="group" aria-label="'+t('words_aria')+'">'+st.words.map(function(w,i){return '<button class="word" data-act="tap" data-i="'+i+'" aria-pressed="'+(S.tap.indexOf(i)>=0)+'" '+(locked?'disabled':'')+'>'+esc(w)+'</button>'}).join('')+'</div><p class="hint">'+t('marked',{n:S.tap.length})+'</p>';
  if(st.type==='match')h+='<div class="match">'+st.items.map(function(it,i){return '<div class="mrow"><label for="m'+i+'">'+(it[2]?SHIELD(it[2]):'')+'<span>'+esc(it[0])+'</span></label><select id="m'+i+'" data-act="match" data-i="'+i+'" '+(locked?'disabled':'')+'><option value="">'+(st.kind==='parts'?t('choose_part'):t('choose_rule'))+'</option>'+st.cats.map(function(c,ci){return '<option value="'+ci+'" '+(S.match[i]===ci?'selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'}).join('')+'</div>';
  if(st.type==='unscramble'){
    var slots='';for(var i=0;i<st.tiles.length;i++){var u=S.unscr[i];slots+='<span class="slot'+(u!=null?' f':'')+'">'+(u!=null?st.tiles[u]:'')+'</span>'}
    h+='<div class="slots" aria-label="'+t('pw_aria',{w:S.unscr.map(function(i){return st.tiles[i]}).join(' ')})+'">'+slots+'</div>'+
    '<div class="tiles">'+st.tiles.map(function(l,i){return '<button class="tile" data-act="tile" data-i="'+i+'" '+(S.unscr.indexOf(i)>=0?'disabled':'')+' aria-label="'+t('letter_aria',{l:l})+'">'+l+'</button>'}).join('')+'</div>'+
    '<div class="row"><button class="btn ghost" data-act="undo" '+(S.unscr.length?'':'disabled')+'>'+t('undo')+'</button><button class="btn ghost" data-act="clear" '+(S.unscr.length?'':'disabled')+'>'+t('clear')+'</button></div>';}
  if(S.fb)h+='<div class="fb '+(S.fb.ok?'ok':'bad')+'" id="fb" tabindex="-1" role="status"><b>'+(S.fb.ok?t('lock_open'):t('not_quite',{p:PEN}))+'</b><span>'+esc(fbText(S.fb))+'</span>'+(S.fb.ok?'':'<span class="small muted">'+t('adjust')+'</span>')+'</div>';
  if(locked&&S.fb.final){}
  else if(locked){var nx=STAGES[S.stage+1];h+='<div class="row"><button class="btn primary" data-act="next" id="nextbtn">'+t('continue_to',{r:esc(nx?nx.room:t('the_pod'))})+'</button><span class="kbd">Enter</span></div>';}
  else h+='<div class="row"><button class="btn primary" data-act="submit" id="subbtn" '+(canSubmit()?'':'disabled')+'>'+t('submit')+'</button><span class="muted small">'+(canSubmit()?t('press_enter'):t('choose_first'))+'</span></div>';
  return h+'</div>';}

function render(){
  var v='';
  switch(S.screen){
    case 'home':v=homeView();break;
    case 'join':v=joinView();break;
    case 'host':v=(S.hostPhase==='lobby')?hostLobbyView():hostLiveView();break;
    case 'lobby':v=lobbyView();break;
    case 'countdown':v=countdownView();break;
    case 'game':v=gameView();break;
    case 'done':v=doneView();break;
    case 'ended':v=endedView();break;
    case 'timeup':v=timeupView();break;}
  barEl.innerHTML=barView();app.innerHTML=v;var lf=document.getElementById('langfab');if(lf)lf.innerHTML=langBtn();updateLive();}
function focusId(id){var e=document.getElementById(id);if(e)e.focus()}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.dataset.act,i=Number(b.dataset.i);
  if(b.tagName==='SELECT')return;
  switch(a){
    case 'lang':setLang(LANG==='ar'?'en':'ar');break;
    case 'host':hostCreate();break;
    case 'tojoin':leaveRoom().then(function(){S.screen='join';S.joinErr='';S.mode=null;render();focusId(S.codeInput?'in-name':'in-code')});break;
    case 'solo':solo();break;
    case 'home':goHome();break;
    case 'color':S.color=i;saveProfile();render();break;
    case 'copy':(function(){var c=$('#copied');var ok=function(){c.textContent=t('copied',{c:S.code})};var no=function(){c.textContent=t('copy_blocked',{c:S.code})};
      try{navigator.clipboard.writeText(S.code).then(ok,no)}catch(err){no()}})();break;
    case 'copylink':(function(){var c=$('#copied');var l=joinLink();try{navigator.clipboard.writeText(l).then(function(){c.textContent=t('link_copied')},function(){c.textContent=t('link_blocked')})}catch(err){c.textContent=t('link_blocked')}})();break;
    case 'start':hostSetPhase('live');break;
    case 'end':S.endConfirm=true;render();break;
    case 'endno':S.endConfirm=false;render();break;
    case 'endyes':hostSetPhase('ended');play('win');confetti();break;
    case 'again':S.record={};hostSetPhase('lobby');break;
    case 'limit':S.limitMin=i;render();break;
    case 'export':exportBoard();break;
    case 'mute':setMuted(!muted);render();break;
    case 'pick':play('click');S.sel=i;if(S.fb&&!S.fb.ok)S.fb=null;render();break;
    case 'tap':play('click');var k=S.tap.indexOf(i);if(k>=0)S.tap.splice(k,1);else S.tap.push(i);if(S.fb&&!S.fb.ok)S.fb=null;render();break;
    case 'tile':play('click');S.unscr.push(i);if(S.fb&&!S.fb.ok)S.fb=null;render();break;
    case 'undo':S.unscr.pop();S.fb=null;render();break;
    case 'clear':S.unscr=[];S.fb=null;render();break;
    case 'submit':submit();break;
    case 'next':advance();break;
    case 'startpuzzle':startPuzzle();break;}});
app.addEventListener('change',function(e){var el=e.target;if(el.dataset&&el.dataset.act==='match'){S.match[Number(el.dataset.i)]=el.value===''?null:Number(el.value);if(S.fb&&!S.fb.ok)S.fb=null;
  var sb=$('#subbtn');if(sb){sb.disabled=!canSubmit();if(sb.nextElementSibling)sb.nextElementSibling.textContent=canSubmit()?t('press_enter'):t('choose_first')}
  var fb=$('#fb');if(fb&&!S.fb)fb.remove();}});
app.addEventListener('input',function(e){var el=e.target;
  if(el.id==='in-code'){var v=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(el.value!==v)el.value=v;S.codeInput=v;}
  if(el.id==='in-name'){S.name=el.value.slice(0,14);}});
app.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='joinform')playerJoin();});
document.addEventListener('keydown',function(e){
  if(S.screen!=='game')return;var tag=(e.target.tagName||'');if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  var st=STAGES[S.stage];
  if(st&&S.phase==='quiz'&&st.type==='choice'&&!(S.fb&&S.fb.ok)&&/^[1-4]$/.test(e.key)){S.sel=Number(e.key)-1;if(S.fb&&!S.fb.ok)S.fb=null;render();e.preventDefault();return}
  if(e.key==='Enter'){if(e.target.closest&&e.target.closest('button')&&!e.target.closest('#subbtn,#nextbtn,#briefnext'))return;e.preventDefault();submit();}});
applyLang();

/* ---------- ticker ---------- */
setInterval(function(){
  if(S.screen==='countdown'){if(Date.now()>=S.cdEnd){S.startLocal=S.cdEnd;S.screen='game';S.phase='brief';S.enter=true;play('go');play('door');render();S.enter=false;clearDoors();focusId('briefnext');}else{var c=$('#cd'),n=String(Math.max(1,Math.ceil((S.cdEnd-Date.now())/1000)));if(c&&c.textContent!==n){c.textContent=n;play('beep')}}}
  var t=$('#timer');if(t)t.textContent=fmt(elapsed());
  var ht=$('#htimer');if(ht)ht.textContent=S.limitMs?fmt(Math.max(0,S.liveAt+S.limitMs-Date.now())):fmt(Math.max(0,Date.now()-S.liveAt));
  if(S.mode==='host'&&S.hostPhase==='live'&&S.limitMs&&Date.now()>=S.liveAt+S.limitMs+1500){hostSetPhase('ended');play('win');confetti();}
  var tl=$('#tleft');if(tl&&S.limitMs&&S.startLocal)tl.textContent=fmt(Math.max(0,S.startLocal+S.limitMs-Date.now()));
  if(S.mode==='player'&&S.screen==='game'&&S.limitMs&&S.startLocal&&S.finishMs==null&&!(S.fb&&S.fb.final)&&Date.now()>=S.startLocal+S.limitMs){S.screen='timeup';play('bad');pushPresence();render();}
},100);

/* ---------- live rooms over this site's own WebSocket server ---------- */
function createRoomClient(onStatus){
  var ws=null,myId=null,cur=null,retry=600,everOpen=false;
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
  function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
  function connect(){
    try{ws=new WebSocket(url)}catch(e){setTimeout(connect,retry);return}
    ws.onopen=function(){retry=600;everOpen=true;onStatus(true);if(cur)send({t:'join',room:cur.name,presence:cur.me})};
    ws.onmessage=function(e){var m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==='hello')myId=m.id;
      else if(m.t==='peers'&&cur&&m.room===cur.name){var st=cur;
        st.list=Object.freeze((m.peers||[]).map(function(p){return Object.freeze({peer:p.id,sameTab:p.id===myId,isMe:p.id===myId,kind:'viewer',presence:Object.freeze(p.presence||{})})}));
        if(st.resolve){st.resolve(st.api);st.resolve=null;st.reject=null}
        st.fns.slice().forEach(function(f){try{f({peers:st.list})}catch(x){}});}
      else if(m.t==='error'&&cur&&cur.reject){cur.reject({code:m.code==='room_full'?'limit_reached':'invalid_argument'});cur.reject=null;cur=null}};
    ws.onclose=function(){onStatus(false);setTimeout(connect,retry);retry=Math.min(retry*2,5000)};
  }
  connect();
  return {
    join:function(name){
      if(cur&&cur.name!==name){send({t:'leave'});cur=null}
      if(cur)return Promise.resolve(cur.api);
      var st={name:name,me:{},list:Object.freeze([]),fns:[]};
      st.api={name:name,
        peers:function(){return st.list},
        onPeers:function(fn){st.fns.push(fn);return function(){var i=st.fns.indexOf(fn);if(i>=0)st.fns.splice(i,1)}},
        presence:function(patch){Object.keys(patch).forEach(function(k){if(patch[k]===null)delete st.me[k];else st.me[k]=patch[k]});if(cur===st)send({t:'presence',data:st.me});return Promise.resolve()},
        connected:function(){return !!ws&&ws.readyState===1},
        leave:function(){if(cur===st){send({t:'leave'});cur=null}st.fns=[];return Promise.resolve()}};
      cur=st;
      return new Promise(function(res,rej){st.resolve=res;st.reject=rej;send({t:'join',room:name,presence:st.me});
        setTimeout(function(){if(st.resolve){st.resolve=null;st.reject=null;if(cur===st)cur=null;rej({code:'upstream_error'})}},8000);});
    },
    everOpen:function(){return everOpen}
  };
}
var client=createRoomClient(function(up){
  var was=roomApi;
  if(up){roomApi=client;S.offline=false}else if(client.everOpen()){S.offline=true}
  if(was!==roomApi&&(S.screen==='home'||S.screen==='join'))render();
  var ob=document.getElementById('offline');if(ob)ob.hidden=!S.offline;
});
setTimeout(function(){if(roomApi===undefined){roomApi=null;if(S.screen==='home'||S.screen==='join')render()}},6000);
(function(){var q=new URLSearchParams(location.search).get('code');
  if(q&&/^[A-Za-z]{4}$/.test(q)){S.codeInput=q.toUpperCase();S.screen='join';}})();
render();
})();
</script>
